mode: standalone
replicas: 1

rootUser: "minioadmin"
rootPassword: "minioadmin123"

resources:
  requests:
    memory: 512Mi
    cpu: 1000m

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""   # or set to your cluster’s storageClass name

service:
  type: ClusterIP
  port: 9000
  consolePort: 9001

ingress:
  enabled: false     # set to true if you want Ingress
