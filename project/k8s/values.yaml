# values.yaml
# OpenWhisk Helm configuration for a 3-node Kubernetes cluster
# Use with: helm install ow openwhisk/openwhisk -n openwhisk -f values.yaml

whisk:
  ingress:
    type: NodePort
    apiHostName: ow-nginx
    apiHostPort: 443
    useInternally: false
  limits:
    actionsInvokesConcurrent: 8
    actionsInvokesPerminute: 120
  # loadbalancer:
  #   kind: ShardingContainerPoolBalancer
  # controller:
  #   replicas: 1
  # invoker:
  #   replicas: 1
  # runtimes:
  #   languages: [nodejs, python, java]

# nginx:
#   httpsNodePort: 31001

# CouchDB storage for actions, activations, etc.
db:
  external: false
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "local-path"

# Kafka for messaging between controller and invokers
kafka:
  replicas: 1
  persistence:
    enabled: true
    size: 512Mi
    storageClass: "local-path"

providers:
  alarm:
    enabled: false

# Redis for load balancer state
redis:
  enabled: true

# Enable metrics and logs (optional)
metrics:
  prometheus:
    enabled: true
  grafana:
    enabled: true

# Kubernetes resource tuning
invoker:
  containerFactory:
    impl: "kubernetes"
  prewarm:
      - kind: "python:3.11"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

controller:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# Node affinity example (optional)
# tolerations: []
# affinity: {}

# Persistence volume class (adjust to your cluster)
persistence:
  defaultStorageClass: local-path
